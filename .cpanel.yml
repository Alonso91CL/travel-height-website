---
# Despliegue automatico para cPanel (Git Version Control).
# Formato oficial: https://docs.cpanel.net/knowledge-base/web-services/guide-to-git-deployment/
#
# Este repositorio ya NO incluye el build: dist/ esta en .gitignore y el
# contenido del sitio se entrega por FTP despues de compilar localmente
# (pnpm build). Los hosts compartidos no tienen RAM para compilar Astro.
#
# Estas tareas solo sincronizan codigo fuente y reinician la app Node si
# existe (inofensivo en modo estatico con public_html).
deployment:
  tasks:
    - 'echo "Codigo actualizado. Si cambio contenido visible, sube dist/ por FTP."'
    - mkdir -p tmp && touch tmp/restart.txt
